name: grana_amiga
description: "Grana Amiga - CitizenTech de educação e organização financeira para famílias de baixa renda."
# O app não é publicado no pub.dev.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Leitura de textos em voz alta (audiodescrição) em Android, iOS e Web.
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
